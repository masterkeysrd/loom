<svg xmlns="http://www.w3.org/2000/svg" width="440" height="242" viewBox="0 0 440 242" role="img" aria-labelledby="title desc">
  <title id="title">Three parallel reads, one join</title>
  <desc id="desc">Start fans out to fetch documents, a profile, and permissions concurrently. The three branches join at one synthesis node.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .label, .ink { font-size: 19px; font-weight: 550; }
    .label { fill: #edf9f6; } .ink { fill: #103c35; }
    .caption { fill: #b6d9d1; font-size: 17px; }
    .step { fill: #22484a; stroke: #77aba2; }
    .focus { fill: #a7ecd4; }
    .edge { fill: none; stroke: #94ddc9; stroke-width: 2; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#94ddc9" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="440" height="242" rx="16" fill="#112e31"/>
  <rect x="170" y="15" width="100" height="36" rx="18" class="step"/>
  <text x="220.0" y="39.0" class="label" text-anchor="middle">Start</text>
  <path d="M220 51v20M76 71h288" class="edge"/>
  <path d="M76 71v23" class="edge" marker-end="url(#arrow)"/>
  <path d="M220 71v23" class="edge" marker-end="url(#arrow)"/>
  <path d="M364 71v23" class="edge" marker-end="url(#arrow)"/>
  <rect x="10" y="100" width="132" height="46" rx="9" class="step"/>
  <text x="76.0" y="129.0" class="label" text-anchor="middle">Documents</text>
  <rect x="154" y="100" width="132" height="46" rx="9" class="step"/>
  <text x="220.0" y="129.0" class="label" text-anchor="middle">Profile</text>
  <rect x="298" y="100" width="132" height="46" rx="9" class="step"/>
  <text x="364.0" y="129.0" class="label" text-anchor="middle">Permissions</text>
  <path d="M76 146v26h288v-26M220 146v26" class="edge"/>
  <path d="M220 172v18" class="edge" marker-end="url(#arrow)"/>
  <rect x="135" y="196" width="170" height="34" rx="9" class="focus"/>
  <text x="220.0" y="219.0" class="ink" text-anchor="middle">Synthesize</text>
</svg>
