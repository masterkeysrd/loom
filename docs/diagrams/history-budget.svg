<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to fit conversation history</title>
  <desc id="desc">With a budget for recent turns, last-message trimming drops older turns. Summarization can keep their gist alongside recent turns.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .label, .ink { font-size: 19px; font-weight: 550; }
    .label { fill: #edf9f6; } .ink { fill: #103c35; }
    .caption { fill: #b6d9d1; font-size: 17px; }
    .step { fill: #22484a; stroke: #77aba2; }
    .focus { fill: #a7ecd4; }
    .edge { fill: none; stroke: #94ddc9; stroke-width: 2; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#94ddc9" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="440" height="230" rx="16" fill="#112e31"/>
  <text x="20" y="34" class="caption" text-anchor="start">Original history</text>
  <rect x="20" y="45" width="197" height="34" rx="9" class="step"/>
  <text x="118.5" y="68.0" class="label" text-anchor="middle">Older turns</text>
  <rect x="222" y="45" width="198" height="34" rx="9" class="step"/>
  <text x="321.0" y="68.0" class="label" text-anchor="middle">Recent turns</text>
  <text x="20" y="104" class="caption" text-anchor="start">Trim from the start</text>
  <rect x="20" y="116" width="197" height="34" rx="9" fill="none" stroke="#77aba2" stroke-dasharray="5 6"/>
  <text x="118" y="139" class="caption" text-anchor="middle">Dropped</text>
  <rect x="222" y="116" width="198" height="34" rx="9" class="step"/>
  <text x="321.0" y="139.0" class="label" text-anchor="middle">Recent turns</text>
  <text x="20" y="176" class="caption" text-anchor="start">Summarize older turns</text>
  <rect x="20" y="187" width="138" height="32" rx="9" class="focus"/>
  <text x="89.0" y="209.0" class="ink" text-anchor="middle">Summary</text>
  <rect x="164" y="187" width="198" height="32" rx="9" class="step"/>
  <text x="263.0" y="209.0" class="label" text-anchor="middle">Recent turns</text>
</svg>
