name: Documentation

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: make docs
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test the first graph and checkpoint tutorials
        run: go test ./examples/quickstart ./examples/resume
      - name: Upload the release site
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    # The Pages publishing source must be GitHub Actions.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
